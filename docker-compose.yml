version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: liquidity_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/liquidity_monitor
      DATABASE_URL_SYNC: postgresql://postgres:password@postgres:5432/liquidity_monitor
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/liquidity_monitor
      DATABASE_URL_SYNC: postgresql://postgres:password@postgres:5432/liquidity_monitor
      REDIS_URL: redis://redis:6379/0
      USER_AGENT: "WallStreetSilver-LiquidityMonitor/0.1"
      SCRAPE_DELAY_SECONDS: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped
    command: ["python", "-m", "etl.jobs.hourly"]

volumes:
  postgres_data:
  redis_data:
